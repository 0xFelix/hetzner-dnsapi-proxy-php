name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate composer.json (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer validate --strict

  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      # The public suffix list is fetched by composer's install hook; caching it
      # keeps every job from hitting publicsuffix.org on each run.
      - uses: actions/cache@v6
        with:
          path: data/public_suffix_list.dat
          key: psl-${{ github.run_id }}
          restore-keys: psl-
      - uses: ramsey/composer-install@v3
      - run: composer lint

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - uses: actions/cache@v6
        with:
          path: data/public_suffix_list.dat
          key: psl-${{ github.run_id }}
          restore-keys: psl-
      - uses: ramsey/composer-install@v3
      - run: composer test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      # --locked audits composer.lock directly, so no install step is needed.
      - run: composer audit --locked --no-dev
